{{ $imgSize := .Get `img-size` | default "33" }}
{{ $side := .Get `side` | default "left" }}
{{ $alt := .Get `alt` | default "" }}

<div class="image-paragraph image-paragraph-{{ $side }}" style="--image-paragraph-size: {{ $imgSize }}%;">
    <div class="image-paragraph-media">
        <img src="/{{ .Get `src` }}" alt="{{ $alt }}">
    </div>
    <div class="image-paragraph-body">
        {{ .Inner | markdownify }}
    </div>
</div>
